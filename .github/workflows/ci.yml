name: ci

# Every job below runs a script from test/ that also runs locally
# (bash test/test-<name>.sh); the workflow only provides the environment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Static checks: shell scripts, Python scripts, workflow files.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck scripts/*.sh test/*.sh containers/*.sh
      - name: ruff (Python scripts)
        run: pipx run --spec 'ruff==0.16.7' ruff check scripts
      # github.job_workflow_sha (the ref check.yml checks itself out at) is a
      # documented context property that actionlint does not know yet:
      # https://github.com/rhysd/actionlint/issues/671
      - name: actionlint (workflow files)
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color \
            -ignore 'property "job_workflow_sha" is not defined'

  # ---------------------------------------------------------------------------
  # Unit tests that need nothing but bash and python3.
  # ---------------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resolve-distro.sh / resolve-policy.sh
        run: bash test/test-resolve.sh
      - name: parse-related-prs.py
        run: bash test/test-related-prs.sh
      - name: locate-library.sh
        run: bash test/test-locate-library.sh
      - name: colcon-build.sh (stub colcon / rosdep)
        run: bash test/test-colcon-build.sh

  # ---------------------------------------------------------------------------
  # sync-upstream.py against local git repositories (test/sync-upstream-fixture.sh).
  # ---------------------------------------------------------------------------
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install vcstool exactly the way the runtime images get it: the
      # python3-vcstool Debian package from the ROS apt repository. It is not in
      # Ubuntu's own archive, and the PyPI release (0.3.0, 2021) imports
      # pkg_resources, which current setuptools no longer provides, so a pip or
      # pipx install starts up broken.
      - name: Install vcstool from the ROS apt repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo -E bash containers/install-ros-apt-source.sh
          sudo apt-get install -y python3-vcstool python3-yaml
          vcs --version
      - name: sync-upstream.py
        run: bash test/test-sync-upstream.sh

  # ---------------------------------------------------------------------------
  # Smoke-test the source-image toolchain on every base image in minutes
  # instead of hours: the same install-ros-apt-source.sh and ros-dev-tools
  # setup as containers/source.Dockerfile, then build-underlay.sh on a one-file
  # CMake package. Catches toolchain drift on a new Ubuntu release (Python,
  # EmPy, colcon, coreutils) before the nightly image build hits it.
  # ---------------------------------------------------------------------------
  source-toolchain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # distro -> BASE_IMAGE pairs as in containers/distro-args.sh (a job's
        # container image cannot be computed by a step).
        include:
          - distro: humble
            base: jammy
          - distro: jazzy
            base: noble
          - distro: kilted
            base: noble
          - distro: lyrical
            base: '26.04'
          - distro: rolling
            base: '26.04'
    container:
      image: docker.io/library/ubuntu:${{ matrix.base }}
    # Inside a bare container the runner defaults to `sh -e`; the scripts use
    # bash features.
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Set locale and enable the ROS 2 apt repository (as the Dockerfile does)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash containers/install-ros-apt-source.sh
          apt-get install -y ros-dev-tools
      - name: build-underlay.sh / finalize-source-image.sh on a one-package workspace
        run: bash test/test-source-toolchain.sh

  # ---------------------------------------------------------------------------
  # End-to-end self-test of the composite action against the toy fixture.
  # Builds the toy library three ways and checks the verdict / fail behaviour.
  # ---------------------------------------------------------------------------
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build toy libraries (baseline / additions / breaking)
        working-directory: test/fixtures/toy-ros-pkg
        run: |
          set -euo pipefail
          mkdir -p out
          g++ -g -Og -fPIC -shared -Iinclude src/counter.cpp \
            -o out/base.so
          g++ -g -Og -fPIC -shared -Iinclude -DADD_SYMBOL src/counter.cpp \
            -o out/additions.so
          g++ -g -Og -fPIC -shared -Iinclude -DBREAK_ABI src/counter.cpp \
            -o out/breaking.so

      - name: Additions under strict policy -> additions-only, passes
        id: additions
        uses: ./
        with:
          package: toy-additions
          library: libtoy_ros_pkg.so
          base-lib: test/fixtures/toy-ros-pkg/out/base.so
          head-lib: test/fixtures/toy-ros-pkg/out/additions.so
          policy: strict
          comment-pr: 'false'

      - name: Assert additions-only
        env:
          VERDICT: ${{ steps.additions.outputs.verdict }}
        run: |
          echo "verdict=$VERDICT"
          [[ "$VERDICT" == "additions-only" ]]

      - name: Breaking under advisory policy -> incompatible, passes
        id: advisory
        uses: ./
        with:
          package: toy-advisory
          library: libtoy_ros_pkg.so
          base-lib: test/fixtures/toy-ros-pkg/out/base.so
          head-lib: test/fixtures/toy-ros-pkg/out/breaking.so
          policy: advisory
          comment-pr: 'false'

      - name: Assert incompatible (advisory did not fail)
        env:
          VERDICT: ${{ steps.advisory.outputs.verdict }}
        run: |
          echo "verdict=$VERDICT"
          [[ "$VERDICT" == "incompatible" ]]

      - name: Breaking under strict policy -> should fail the step
        id: strict
        continue-on-error: true
        uses: ./
        with:
          package: toy-strict
          library: libtoy_ros_pkg.so
          base-lib: test/fixtures/toy-ros-pkg/out/base.so
          head-lib: test/fixtures/toy-ros-pkg/out/breaking.so
          policy: strict
          comment-pr: 'false'

      - name: Assert strict policy failed on the break
        env:
          OUTCOME: ${{ steps.strict.outcome }}
          VERDICT: ${{ steps.strict.outputs.verdict }}
        run: |
          echo "outcome=$OUTCOME"
          echo "verdict=$VERDICT"
          [[ "$OUTCOME" == "failure" ]]
          [[ "$VERDICT" == "incompatible" ]]
