name: ROS 2 ABI Check

# Reusable workflow that builds one or more ROS 2 packages twice (PR target
# branch + PR head) in the matching distro container, then delegates the ABI
# diff to fujitatomoya/libabigail-action via this repo's composite action.
# REP-0009 policy is applied automatically from the PR's target branch.
#
# Consumers call it like:
#
#   jobs:
#     abi:
#       uses: fujitatomoya/ros2-abi-action/.github/workflows/check.yml@v1
#       with:
#         package: rclcpp
#         soname: librclcpp.so
#         suppressions: .abignore
#
# Multi-package repositories list every package whose libraries should be
# checked; they are built together in a single colcon invocation:
#
#       with:
#         package: rclcpp rclcpp_action rclcpp_components rclcpp_lifecycle
#         soname: 'lib*.so'
#
# ROS 2 core repositories develop against the source branches of their
# dependencies, which are usually ahead of the released binaries. They must
# use build-mode: source, which imports the distro's ros2.repos and builds
# the PR against today's source tree (a nightly source-built underlay,
# ros-abi:<distro>-source, caches whatever did not move since):
#
#       with:
#         package: rclcpp rclcpp_action rclcpp_components rclcpp_lifecycle
#         soname: 'lib*.so'
#         build-mode: source
#
# Paired changes across repositories are declared by the PR author in the PR
# description and are applied to the PR side of the build:
#
#   Depends-On: ros2/rcl#1234

on:
  workflow_call:
    inputs:
      package:
        description: >-
          Colcon package name(s) to build. Space-separated for multi-package
          repos (e.g. "rclcpp rclcpp_action rclcpp_lifecycle"); all names go
          to one colcon --packages-up-to, so the union of their dependency
          closures is built exactly once per side.
        required: true
        type: string
      soname:
        description: 'Library file name or glob (e.g. librclcpp.so or lib*.so).'
        required: true
        type: string
      distro:
        description: 'auto (derive from PR target branch) or explicit distro.'
        required: false
        type: string
        default: 'auto'
      build-mode:
        description: >-
          binary (default): build against the released ros-<distro> Debian
          packages; right for downstream packages. source: import the distro's
          ros2.repos and build against today's source tree; required for ROS 2
          core repositories whose dependencies are ahead of the binaries.
        required: false
        type: string
        default: 'binary'
      source-strategy:
        description: >-
          Source mode only. incremental (default): recompile only the upstream
          packages that moved since the nightly <image-prefix>:<distro>-source
          image was built (plus their dependents and the targets), taking the
          rest from the image. scratch: ignore the prebuilt underlay and compile
          the whole dependency closure from source in the same image; slower,
          no cache.
        required: false
        type: string
        default: 'incremental'
      related-prs:
        description: >-
          Additional related pull requests to apply on the PR side, as
          "owner/repo#N" or PR URLs (whitespace or comma separated). Merged
          with the "Depends-On:" lines parsed from the PR description.
        required: false
        type: string
        default: ''
      suppressions:
        description: 'Path to a suppression file relative to the repo root.'
        required: false
        type: string
        default: ''
      policy:
        description: 'auto | strict (fail on break) | advisory (warn only).'
        required: false
        type: string
        default: 'auto'
      upstream-workspace:
        description: 'Path to a .repos file for additional source dependencies.'
        required: false
        type: string
        default: ''
      comment-pr:
        description: 'Post / update a sticky comment on the pull request.'
        required: false
        type: boolean
        default: true
      label-compat:
        description: 'Label applied when ABI is compatible / additions-only.'
        required: false
        type: string
        default: 'ABI compatible'
      label-break:
        description: 'Label applied when ABI is incompatible.'
        required: false
        type: string
        default: 'ABI break'
      image-prefix:
        description: 'Container image repository prefix (<prefix>:<distro>).'
        required: false
        type: string
        default: 'ghcr.io/fujitatomoya/ros-abi'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # Resolve distro -> container image and the related PRs once, up front.
  # (The REP-0009 policy is resolved by the composite action in the diff job,
  # from the distro resolved here.)
  # ---------------------------------------------------------------------------
  resolve:
    runs-on: ubuntu-latest
    outputs:
      distro: ${{ steps.distro.outputs.distro }}
      build-mode: ${{ steps.distro.outputs.build-mode }}
      source-strategy: ${{ steps.distro.outputs.source-strategy }}
      image: ${{ steps.distro.outputs.image }}
      related-prs: ${{ steps.related.outputs.related-prs }}
    steps:
      - name: Checkout ros2-abi-action
        uses: actions/checkout@v4
        with:
          repository: fujitatomoya/ros2-abi-action
          ref: ${{ github.job_workflow_sha }}
          path: ._ros2-abi-action

      - name: Resolve distro and image
        id: distro
        env:
          INPUT_DISTRO: ${{ inputs.distro }}
          IMAGE_PREFIX: ${{ inputs.image-prefix }}
          BUILD_MODE: ${{ inputs.build-mode }}
          SOURCE_STRATEGY: ${{ inputs.source-strategy }}
        run: bash ._ros2-abi-action/scripts/resolve-distro.sh

      # The PR body is untrusted input: it is passed through the environment,
      # never interpolated into a script, and only yields owner/repo#N tokens.
      - name: Parse related pull requests (Depends-On)
        id: related
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          RELATED_PRS_INPUT: ${{ inputs.related-prs }}
        run: python3 ._ros2-abi-action/scripts/parse-related-prs.py

  # ---------------------------------------------------------------------------
  # Build the package(s) twice: against the PR target branch and the PR head.
  # ---------------------------------------------------------------------------
  build:
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.resolve.outputs.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: base
            ref: ${{ github.base_ref }}
          - side: pr
            ref: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout ros2-abi-action
        uses: actions/checkout@v4
        with:
          repository: fujitatomoya/ros2-abi-action
          ref: ${{ github.job_workflow_sha }}
          path: ._ros2-abi-action

      - name: Checkout package source (${{ matrix.side }} @ ${{ matrix.ref }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: ws/src/pkg
          fetch-depth: 0

      - name: Import upstream workspace (.repos)
        if: inputs.upstream-workspace != ''
        working-directory: ws
        run: |
          set -euo pipefail
          vcs import src < "src/pkg/${{ inputs.upstream-workspace }}"

      # Source mode: import the distro manifest (minus the repository under
      # test, already at ws/src/pkg) and work out which upstream repositories
      # moved since the underlay image was built. Both modes: check out the
      # related PRs declared in the PR description, on the PR side only, so the
      # base side stays the pre-PR world.
      - name: Sync upstream sources and related pull requests
        if: needs.resolve.outputs.build-mode == 'source' || (matrix.side == 'pr' && needs.resolve.outputs.related-prs != '')
        id: sync
        working-directory: ws
        env:
          MODE: ${{ needs.resolve.outputs.build-mode }}
          STRATEGY: ${{ needs.resolve.outputs.source-strategy }}
          EXCLUDE_REPO: ${{ github.repository }}
          ROS_DISTRO: ${{ needs.resolve.outputs.distro }}
          RELATED_PRS: ${{ matrix.side == 'pr' && needs.resolve.outputs.related-prs || '' }}
        run: |
          export WORKSPACE_SRC="$GITHUB_WORKSPACE/ws/src"
          export DEST="$WORKSPACE_SRC/upstream"
          python3 "$GITHUB_WORKSPACE/._ros2-abi-action/scripts/sync-upstream.py"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: abi-ccache-${{ needs.resolve.outputs.distro }}-${{ needs.resolve.outputs.build-mode }}-${{ matrix.side }}-${{ hashFiles('ws/src/**/package.xml', 'ws/src/**/*.repos') }}
          restore-keys: |
            abi-ccache-${{ needs.resolve.outputs.distro }}-${{ needs.resolve.outputs.build-mode }}-${{ matrix.side }}-

      # Incremental source builds keep the DDS vendors from the nightly image
      # even when their repositories moved (colcon-build.sh's default
      # PACKAGES_SKIP_REGEX); scratch builds compile them like everything else.
      - name: Build
        working-directory: ws
        env:
          PACKAGE: ${{ inputs.package }}
          ROS_DISTRO: ${{ needs.resolve.outputs.distro }}
          SOURCE_STRATEGY: ${{ needs.resolve.outputs.source-strategy }}
          REBUILD_PATHS: ${{ steps.sync.outputs.rebuild-paths }}
        run: |
          # In container jobs ${{ github.workspace }} is the host path, but the
          # workspace is mounted at $GITHUB_WORKSPACE inside the container, so
          # always resolve paths through $GITHUB_WORKSPACE here.
          export WORKSPACE="$GITHUB_WORKSPACE/ws"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          bash "$GITHUB_WORKSPACE/._ros2-abi-action/scripts/colcon-build.sh"

      # Only the packages under test are diffed: with PACKAGE set (and no
      # SEARCH_DIR) locate-library.sh searches their install prefixes only, so
      # dependencies rebuilt from source in this workspace are not picked up
      # by the soname glob.
      - name: Locate built library/libraries
        working-directory: ws
        env:
          SONAME: ${{ inputs.soname }}
          PACKAGE: ${{ inputs.package }}
          SIDE: ${{ matrix.side }}
        run: |
          export COPY_TO="$GITHUB_WORKSPACE/abi-artifacts/$SIDE"
          bash "$GITHUB_WORKSPACE/._ros2-abi-action/scripts/locate-library.sh"

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: lib-${{ matrix.side }}
          path: abi-artifacts/${{ matrix.side }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Expand the soname glob into a matrix of concrete library file names.
  # ---------------------------------------------------------------------------
  collect:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.expand.outputs.libraries }}
    steps:
      - name: Checkout ros2-abi-action
        uses: actions/checkout@v4
        with:
          repository: fujitatomoya/ros2-abi-action
          ref: ${{ github.job_workflow_sha }}
          path: ._ros2-abi-action

      - name: Download base libraries
        uses: actions/download-artifact@v4
        with:
          name: lib-base
          path: lib-base

      - name: Expand library list
        id: expand
        env:
          SONAME: '*'
          SEARCH_DIR: lib-base
          MODE: json
        run: |
          libs="$(bash ._ros2-abi-action/scripts/locate-library.sh)"
          echo "libraries=$libs" >> "$GITHUB_OUTPUT"
          echo "Libraries to diff: $libs"

  # ---------------------------------------------------------------------------
  # Diff each library; one job per matched library so per-library comments
  # coexist and any incompatible library fails the workflow under strict policy.
  # ---------------------------------------------------------------------------
  diff:
    needs: [resolve, build, collect]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJSON(needs.collect.outputs.libraries) }}
    steps:
      - name: Checkout ros2-abi-action
        uses: actions/checkout@v4
        with:
          repository: fujitatomoya/ros2-abi-action
          ref: ${{ github.job_workflow_sha }}
          path: ._ros2-abi-action

      - name: Checkout caller repo (for suppressions file)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: caller

      - name: Download base library
        uses: actions/download-artifact@v4
        with:
          name: lib-base
          path: lib-base

      - name: Download head library
        uses: actions/download-artifact@v4
        with:
          name: lib-pr
          path: lib-pr

      # The action resolves the REP-0009 policy from the distro and merges the
      # suppressions itself (a missing suppressions file is reported as a
      # warning there).
      - name: ABI diff for ${{ matrix.library }}
        uses: ./._ros2-abi-action
        with:
          package: ${{ inputs.package }}
          library: ${{ matrix.library }}
          base-lib: lib-base/${{ matrix.library }}
          head-lib: lib-pr/${{ matrix.library }}
          distro: ${{ needs.resolve.outputs.distro }}
          policy: ${{ inputs.policy }}
          suppressions: ${{ inputs.suppressions != '' && format('caller/{0}', inputs.suppressions) || '' }}
          comment-pr: ${{ inputs.comment-pr }}
          label-compat: ${{ inputs.label-compat }}
          label-break: ${{ inputs.label-break }}
